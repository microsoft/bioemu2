name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Install uv
      run: python -m pip install "uv==0.11.0"
    # The version is static in pyproject.toml, so guard against releasing a tag that disagrees with it.
    - name: Check release tag matches package version
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        version="$(uv version --short)"
        if [ "${TAG#v}" != "$version" ]; then
          echo "::error::Release tag '$TAG' does not match pyproject.toml version '$version'"
          exit 1
        fi
    - name: Build
      run: uv build
    - name: Check distributions
      run: uvx twine==6.2.0 check --strict dist/*
    - name: Upload built distributions
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: publish-to-pypi
    permissions:
      id-token: write  # for trusted publishing
    steps:
    - name: Download built distributions
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: dist
        path: dist/
    - name: Publish
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
